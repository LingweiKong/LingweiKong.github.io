# ---------------------------------------------------------------------------
# 侧栏链接清单（author-profile.html 据此生成两套列表）
# ---------------------------------------------------------------------------
#   宽屏：<ul class="author__urls">     图标 + 文字
#   窄屏：<div class="author__urls_sm"> 仅图标
# 字段：
#   key   _config.yml 中 author 下的字段名，该字段为空则本项不渲染
#   label 宽屏显示的文字
#   icon  Font Awesome / Academicons 的 class
#   url   链接模板，%s 处替换为 author 中对应字段的值
# 列表顺序即侧栏显示顺序；图标配色见 _sass/_utilities.scss 的 .social-icons
# ---------------------------------------------------------------------------

- key: uri
  label: Website
  icon: "fas fa-fw fa-link"
  url: "%s"

- key: email
  label: Email
  icon: "fas fa-fw fa-envelope"
  url: "mailto:%s"

