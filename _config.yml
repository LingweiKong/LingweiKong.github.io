# Reading Files
include:
  - _pages
# Gemfile / Gemfile.lock / node_modules / vendor 已在 Jekyll 内置排除规则中，无需重复声明
exclude:
  - .bundle
  - .github
  - .jekyll-cache
  - .sass-cache
  - docs
  - google_scholar_crawler
  - LICENSE
  - README
  - run_server.sh   # 本地预览脚本，不发布到线上
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
timezone: Asia/Shanghai # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
# jekyll-sitemap：生成 sitemap.xml
# jekyll-redirect-from：为 /about/、/zh.html 等旧链接生成跳转页
# （站点无文章，故不需要 jekyll-paginate / jekyll-feed；内容里没有 gist 引用）
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
